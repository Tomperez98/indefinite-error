[package]
name = "indefinite-error-bank"
version = "0.0.0"
edition = "2024"
rust-version = "1.86"
publish = false
description = "Example: a bank that must not double-count, tested under indefinite errors."
readme = "README.md"

[dependencies]
axum = "0.8"
indefinite-error = { path = "../.." }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

[dev-dependencies]
http-body-util = "0.1"
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
