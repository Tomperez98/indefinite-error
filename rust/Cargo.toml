[package]
name = "indefinite-error"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
description = "Reproducibly inject indefinite errors (did it happen or not?) into the boundaries of your system."
keywords = ["testing", "fault-injection", "idempotency", "tower", "chaos"]
categories = ["development-tools::testing", "asynchronous", "web-programming::http-server"]

[dependencies]
blake2 = "0.10"
pin-project-lite = "0.2"
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }
bytes = "1"
http = "1"
http-body = "1"
tower-layer = "0.3"
tower-service = "0.3"

[dev-dependencies]
axum = "0.8"
http-body-util = "0.1"
proptest = "1"
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
tower = { version = "0.5", features = ["util"] }
