# What the merge gate is too slow for: long property runs with fresh examples,
# and mutation testing (every mutant must be killed). GitHub emails a failed
# scheduled run to whoever last changed this schedule; that person triages it.
name: python-nightly

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions: {}

defaults:
  run:
    working-directory: python

jobs:
  nightly:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: python
          python-version: "3.14"
      - run: ./ci nightly

  free-threaded:
    # The thread stress test, repeated: a race that hides once can't hide 50 times.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: python
          python-version: "3.14t"
      - run: ./ci stress
